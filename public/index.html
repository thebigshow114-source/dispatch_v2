<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kitchen Plan Extractor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            bg:      '#0b0d14',
            surface: '#111320',
            card:    '#181b27',
            card2:   '#1e2133',
            border:  '#252838',
            border2: '#2e3248',
            tx:      '#e2e8f4',
            tx2:     '#8b96b0',
            tx3:     '#4e5870',
            accent:  '#7c6dfa',
            accentH: '#6b5cf0',
          },
          animation: {
            'fade-up': 'fadeUp .35s ease both',
            'pulse-dot': 'pulseDot 1.4s ease-in-out infinite',
            'spin-slow': 'spin .65s linear infinite',
          },
          keyframes: {
            fadeUp: {
              from: { opacity: '0', transform: 'translateY(12px)' },
              to:   { opacity: '1', transform: 'translateY(0)' },
            },
            pulseDot: {
              '0%, 100%': { opacity: '1' },
              '50%':      { opacity: '.3' },
            },
          },
        }
      }
    };
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2e3248; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #4e5870; }
    [x-cloak] { display: none !important; }
    .progress-bar { transition: width .45s cubic-bezier(.4,0,.2,1); }
    .section-body { overflow: hidden; transition: max-height .28s cubic-bezier(.4,0,.2,1); }
    .section-body.closed { max-height: 0 !important; }
    .chevron-icon { transition: transform .22s ease; }
    .chevron-icon.closed { transform: rotate(-90deg); }
    @media print {
      aside, header { display: none !important; }
      .layout { display: block !important; }
    }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-bg text-tx font-sans text-sm leading-relaxed min-h-screen" x-data="kpx()" x-cloak>

  <!-- TOP BAR -->
  <header class="h-14 bg-surface border-b border-border flex items-center px-7 gap-3 sticky top-0 z-50 shadow-sm">
    <span class="font-mono text-[13px] font-semibold tracking-[3px] uppercase text-accent">KPX</span>
    <div class="w-px h-5 bg-border2 flex-shrink-0"></div>
    <span class="font-mono text-[10px] tracking-[1.2px] uppercase text-tx3">Kitchen Plan Extractor</span>
    <div class="ml-auto flex items-center gap-2">
      <span class="font-mono text-[10px] px-2 py-0.5 border border-border2 rounded-full text-tx3" x-text="pages ? `${pages} page${pages > 1 ? 's' : ''} parsed` : 'v3.0 · Groq AI'"></span>
      <span x-show="data" x-transition class="font-mono text-[10px] px-2 py-0.5 border border-green-500/40 rounded-full text-green-400 bg-green-500/10">● Live</span>
    </div>
  </header>

  <div class="grid min-h-[calc(100vh-56px)]" style="grid-template-columns: 300px 1fr" x-ref="layout">

    <!-- SIDEBAR -->
    <aside class="border-r border-border px-[18px] py-5 sticky top-14 max-h-[calc(100vh-56px)] overflow-y-auto scrollbar-thin">

      <!-- API Key -->
      <div class="mb-5">
        <div class="font-mono text-[9px] tracking-[1.8px] uppercase text-tx3 mb-2">API Configuration</div>
        <div class="relative">
          <input
            :type="keyVisible ? 'text' : 'password'"
            x-model="apiKey"
            @input="saveKey()"
            placeholder="gsk_…"
            autocomplete="off" spellcheck="false"
            class="w-full bg-card border border-border2 rounded-md py-2 pl-3 pr-9 font-mono text-xs text-tx placeholder-tx3 focus:outline-none focus:border-accent transition-colors"
          />
          <button @click="keyVisible = !keyVisible"
            class="absolute right-2 top-1/2 -translate-y-1/2 text-tx3 hover:text-tx transition-colors text-sm p-1"
          >
            <span x-text="keyVisible ? '🙈' : '👁'"></span>
          </button>
        </div>
        <div class="flex items-center justify-between mt-1.5">
          <span class="text-[11px] text-tx3">
            Free at <a href="https://console.groq.com" target="_blank" class="text-accent hover:underline">console.groq.com</a>
          </span>
          <span x-show="keySaved" x-transition class="font-mono text-[9px] text-green-400 flex items-center gap-1">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5.5L4.5 8L8 3" stroke="#22c55e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Saved
          </span>
        </div>
      </div>

      <!-- Upload zone -->
      <div class="mb-5">
        <div class="font-mono text-[9px] tracking-[1.8px] uppercase text-tx3 mb-2">Kitchen Plan PDF</div>
        <label
          class="block border border-dashed rounded-xl py-7 px-3 text-center cursor-pointer transition-all relative"
          :class="file ? 'border-green-500 bg-green-500/[.06]' : isDragging ? 'border-accent bg-accent/10 border-solid' : 'border-border2 bg-card hover:border-accent hover:bg-accent/[.08]'"
          @dragover.prevent="isDragging = true"
          @dragleave="isDragging = false"
          @drop.prevent="isDragging = false; acceptFile($event.dataTransfer.files[0])"
        >
          <input type="file" accept=".pdf" class="hidden" @change="acceptFile($event.target.files[0])" />
          <div class="text-2xl mb-2 opacity-60" x-text="file ? '✅' : '📄'"></div>
          <div class="text-[13px] font-semibold text-tx2 mb-0.5" x-text="file ? 'PDF ready' : 'Drop PDF here'"></div>
          <div class="font-mono text-[11px] text-tx3" x-text="file ? '' : 'or click to browse'"></div>
          <template x-if="file">
            <div class="mt-2">
              <div class="font-mono text-[11px] text-green-400 break-all leading-snug" x-text="fileName"></div>
              <div class="font-mono text-[10px] text-tx3 mt-0.5" x-text="fileSize"></div>
            </div>
          </template>
        </label>
      </div>

      <!-- Extract button -->
      <div class="mb-5">
        <button
          @click="extract()"
          :disabled="!canExtract"
          class="w-full bg-accent hover:bg-accentH text-white font-semibold rounded-md py-2.5 flex items-center justify-center gap-2 transition-all disabled:opacity-40 disabled:cursor-not-allowed hover:shadow-[0_6px_24px_rgba(124,109,250,.42)] hover:-translate-y-px active:translate-y-0"
        >
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M7 1.5v8M4.5 7L7 9.5l2.5-2.5M2 12h10" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span x-text="loading ? 'Extracting…' : 'Extract Kitchen Data'"></span>
        </button>

        <!-- Progress bar -->
        <div class="mt-3 h-[3px] bg-border rounded-full overflow-hidden">
          <div class="h-full rounded-full progress-bar"
            :style="`width: ${progress}%; background: linear-gradient(90deg, #7c6dfa, #60a5fa)`"
          ></div>
        </div>
        <div class="font-mono text-[10px] text-tx3 mt-1.5 min-h-[14px]" x-text="progressLabel"></div>

        <!-- Status -->
        <div x-show="status.msg" x-transition
          class="mt-2.5 rounded-md px-3 py-2 text-xs flex items-start gap-2 border"
          :class="{
            'bg-blue-500/10 text-blue-400 border-blue-500/20': status.type === 'loading',
            'bg-green-500/10 text-green-400 border-green-500/30': status.type === 'success',
            'bg-red-500/10 text-red-400 border-red-500/30': status.type === 'error',
          }"
        >
          <span x-show="status.type === 'loading'" class="animate-spin-slow w-3 h-3 border-2 border-blue-500/30 border-t-blue-400 rounded-full flex-shrink-0 mt-0.5"></span>
          <span x-show="status.type === 'success'" class="flex-shrink-0">✓</span>
          <span x-show="status.type === 'error'" class="flex-shrink-0">✕</span>
          <span x-text="status.msg"></span>
        </div>

        <!-- Reset -->
        <button x-show="data || status.type === 'error'" x-transition
          @click="reset()"
          class="w-full mt-2 bg-transparent text-tx3 border border-border2 rounded-md py-1.5 text-xs hover:text-red-400 hover:border-red-500/60 transition-colors"
        >↺ Start over</button>
      </div>

      <!-- Tips -->
      <div>
        <div class="font-mono text-[9px] tracking-[1.8px] uppercase text-tx3 mb-2">Notes</div>
        <ul class="text-[11px] text-tx3 space-y-1">
          <template x-for="tip in tips">
            <li class="flex gap-2"><span class="text-accent">·</span><span x-text="tip"></span></li>
          </template>
        </ul>
      </div>

    </aside>

    <!-- MAIN PANEL -->
    <main class="p-8 min-w-0">

      <!-- Empty state -->
      <div x-show="!data && !loading" x-transition
        class="flex flex-col items-center justify-center py-28 text-center"
      >
        <div class="text-5xl mb-5 opacity-15">🏠</div>
        <div class="text-lg font-semibold text-tx2 opacity-40 mb-2">No data yet</div>
        <div class="text-[13px] text-tx3 leading-relaxed max-w-sm">
          Enter your Groq API key, upload a kitchen plan PDF, and click Extract. All structured data will appear here.
        </div>
      </div>

      <!-- Loading skeleton -->
      <div x-show="loading" x-transition class="animate-pulse space-y-3">
        <div class="grid grid-cols-4 gap-3 mb-5">
          <template x-for="i in 4">
            <div class="h-20 bg-card border border-border rounded-xl"></div>
          </template>
        </div>
        <div class="h-10 bg-card border border-border rounded-xl"></div>
        <div class="h-40 bg-card border border-border rounded-xl"></div>
        <div class="h-40 bg-card border border-border rounded-xl"></div>
      </div>

      <!-- Results -->
      <div x-show="data && !loading" x-transition>

        <!-- Stats bar -->
        <div class="grid grid-cols-4 gap-3 mb-5" x-show="data">
          <template x-for="(stat, i) in stats" :key="stat.label">
            <div class="bg-card border border-border rounded-xl p-4 border-t-2 animate-fade-up"
              :class="stat.color"
              :style="`animation-delay: ${i * 40}ms`"
            >
              <div class="font-mono text-[32px] font-bold leading-none mb-1" x-text="stat.value"></div>
              <div class="font-mono text-[9px] tracking-[1.2px] uppercase text-tx3" x-text="stat.label"></div>
            </div>
          </template>
        </div>

        <!-- Export bar -->
        <div class="flex items-center gap-2 mb-5 flex-wrap">
          <span class="font-mono text-[9px] tracking-[1.5px] uppercase text-tx3 mr-1">Export</span>
          <button @click="exportJson()" class="exp-btn inline-flex items-center gap-1.5 font-mono text-[11px] px-3 py-1 rounded border border-border2 bg-card text-tx2 hover:border-accent hover:text-accent hover:bg-accent/10 transition-all">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1.5 8.5h8M5.5 2v5M3.5 5l2 2 2-2" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            JSON
          </button>
          <button @click="exportCsv()" class="exp-btn inline-flex items-center gap-1.5 font-mono text-[11px] px-3 py-1 rounded border border-border2 bg-card text-tx2 hover:border-accent hover:text-accent hover:bg-accent/10 transition-all">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><rect x="1" y="1" width="9" height="9" rx="1.2" stroke="currentColor" stroke-width="1.3"/><path d="M1 3.8h9M1 6.5h9M3.8 3.8v6.2" stroke="currentColor" stroke-width="1.3"/></svg>
            Units CSV
          </button>
          <button @click="copyJson()" class="exp-btn inline-flex items-center gap-1.5 font-mono text-[11px] px-3 py-1 rounded border border-border2 bg-card text-tx2 hover:border-accent hover:text-accent hover:bg-accent/10 transition-all">
            <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><rect x="2.5" y="2.5" width="7" height="7.5" rx="1.2" stroke="currentColor" stroke-width="1.3"/><path d="M1.5 8.5V1.5a1 1 0 0 1 1-1h6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            <span x-text="copied ? '✓ Copied!' : 'Copy JSON'"></span>
          </button>
        </div>

        <!-- ── Accordion sections ── -->
        <div class="space-y-3" x-show="data">

          <!-- Project Info -->
          <template x-if="data && hasProjectInfo">
            <div class="bg-card border border-border rounded-2xl overflow-hidden animate-fade-up" style="animation-delay:40ms">
              <button @click="toggle('project')" class="w-full flex items-center gap-2.5 px-[18px] py-3 border-b border-border hover:bg-white/[.02] transition-colors">
                <span class="text-[15px]">📋</span>
                <span class="text-[13px] font-semibold">Project Information</span>
                <span class="ml-auto text-tx3 text-xs chevron-icon" :class="open.project ? '' : 'closed'">▾</span>
              </button>
              <div class="section-body" :class="open.project ? '' : 'closed'" :style="open.project ? 'max-height: 2000px' : ''">
                <div class="grid gap-px bg-border" style="grid-template-columns: repeat(auto-fill, minmax(180px, 1fr))">
                  <template x-for="cell in projectCells" :key="cell.label">
                    <template x-if="cell.value">
                      <div class="bg-card px-[18px] py-3">
                        <div class="font-mono text-[9px] tracking-[1.2px] uppercase text-tx3 mb-1" x-text="cell.label"></div>
                        <div class="text-[13px] font-semibold" x-text="cell.value"></div>
                      </div>
                    </template>
                  </template>
                </div>
              </div>
            </div>
          </template>

          <!-- Dimensions -->
          <template x-if="data && hasDimensions">
            <div class="bg-card border border-border rounded-2xl overflow-hidden animate-fade-up" style="animation-delay:80ms">
              <button @click="toggle('dimensions')" class="w-full flex items-center gap-2.5 px-[18px] py-3 border-b border-border hover:bg-white/[.02] transition-colors">
                <span class="text-[15px]">📏</span>
                <span class="text-[13px] font-semibold">Dimensions</span>
                <span class="ml-auto text-tx3 text-xs chevron-icon" :class="open.dimensions ? '' : 'closed'">▾</span>
              </button>
              <div class="section-body" :class="open.dimensions ? '' : 'closed'" :style="open.dimensions ? 'max-height: 2000px' : ''">
                <div class="grid gap-px bg-border" style="grid-template-columns: repeat(auto-fill, minmax(130px, 1fr))">
                  <template x-for="dim in dimCells" :key="dim.label">
                    <template x-if="dim.value">
                      <div class="bg-card px-[18px] py-5 text-center">
                        <div class="font-mono text-[26px] font-bold text-accent leading-none mb-1.5" x-text="dim.value"></div>
                        <div class="font-mono text-[9px] tracking-[1.2px] uppercase text-tx3" x-text="dim.label"></div>
                      </div>
                    </template>
                  </template>
                </div>
                <template x-if="data.dimensions && data.dimensions.key_measurements && data.dimensions.key_measurements.length">
                  <div class="px-[18px] py-3 border-t border-border flex flex-wrap gap-1.5">
                    <template x-for="m in data.dimensions.key_measurements">
                      <span class="font-mono text-[11px] px-2.5 py-0.5 bg-card2 border border-border2 rounded text-tx2" x-text="m"></span>
                    </template>
                  </div>
                </template>
              </div>
            </div>
          </template>

          <!-- Base Units -->
          <template x-if="data && data.base_units && data.base_units.length">
            <div class="bg-card border border-border rounded-2xl overflow-hidden animate-fade-up" style="animation-delay:120ms">
              <button @click="toggle('base')" class="w-full flex items-center gap-2.5 px-[18px] py-3 border-b border-border hover:bg-white/[.02] transition-colors">
                <span class="text-[15px]">🗄</span>
                <span class="text-[13px] font-semibold">Base Units</span>
                <span class="font-mono text-[10px] px-2 py-0.5 rounded-full bg-card2 border border-border2 text-tx3" x-text="data.base_units.length"></span>
                <span class="ml-auto text-tx3 text-xs chevron-icon" :class="open.base ? '' : 'closed'">▾</span>
              </button>
              <div class="section-body" :class="open.base ? '' : 'closed'" :style="open.base ? 'max-height: 2000px' : ''">
                <div class="overflow-x-auto">
                  <table class="w-full border-collapse text-[12.5px]">
                    <thead><tr class="bg-card2 border-b border-border2">
                      <th class="unit-th">Code</th><th class="unit-th">Description</th>
                      <th class="unit-th">Width</th><th class="unit-th">Height</th><th class="unit-th">Depth</th>
                      <th class="unit-th">Qty</th><th class="unit-th">Notes</th>
                    </tr></thead>
                    <tbody>
                      <template x-for="u in data.base_units" :key="u.code">
                        <tr class="border-b border-border last:border-0 hover:bg-white/[.02] transition-colors">
                          <td class="px-4 py-2.5 font-mono font-semibold text-tx" x-text="u.code||'—'"></td>
                          <td class="px-4 py-2.5 font-medium text-tx" x-text="u.description||'—'"></td>
                          <td class="px-4 py-2.5 font-mono text-[11px] text-tx3" x-text="u.width||'—'"></td>
                          <td class="px-4 py-2.5 font-mono text-[11px] text-tx3" x-text="u.height||'—'"></td>
                          <td class="px-4 py-2.5 font-mono text-[11px] text-tx3" x-text="u.depth||'—'"></td>
                          <td class="px-4 py-2.5 font-mono text-[11px] text-tx3" x-text="u.quantity||'1'"></td>
                          <td class="px-4 py-2.5 text-[11px] text-tx3 max-w-[200px]" x-text="u.notes||'—'"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </template>

          <!-- Wall Units -->
          <template x-if="data && data.wall_units && data.wall_units.length">
            <div class="bg-card border border-border rounded-2xl overflow-hidden animate-fade-up" style="animation-delay:160ms">
              <button @click="toggle('wall')" class="w-full flex items-center gap-2.5 px-[18px] py-3 border-b border-border hover:bg-white/[.02] transition-colors">
                <span class="text-[15px]">🧱</span>
                <span class="text-[13px] font-semibold">Wall Units</span>
                <span class="font-mono text-[10px] px-2 py-0.5 rounded-full bg-card2 border border-border2 text-tx3" x-text="data.wall_units.length"></span>
                <span class="ml-auto text-tx3 text-xs chevron-icon" :class="open.wall ? '' : 'closed'">▾</span>
              </button>
              <div class="section-body" :class="open.wall ? '' : 'closed'" :style="open.wall ? 'max-height: 2000px' : ''">
                <div class="overflow-x-auto">
                  <table class="w-full border-collapse text-[12.5px]">
                    <thead><tr class="bg-card2 border-b border-border2">
                      <th class="unit-th">Code</th><th class="unit-th">Description</th>
                      <th class="unit-th">Width</th><th class="unit-th">Height</th><th class="unit-th">Depth</th>
                      <th class="unit-th">Qty</th><th class="unit-th">Notes</th>
                    </tr></thead>
                    <tbody>
                      <template x-for="u in data.wall_units" :key="u.code">
                        <tr class="border-b border-border last:border-0 hover:bg-white/[.02] transition-colors">
                          <td class="px-4 py-2.5 font-mono font-semibold text-tx" x-text="u.code||'—'"></td>
                          <td class="px-4 py-2.5 font-medium text-tx" x-text="u.description||'—'"></td>
                          <td class="px-4 py-2.5 font-mono text-[11px] text-tx3" x-text="u.width||'—'"></td>
                          <td class="px-4 py-2.5 font-mono text-[11px] text-tx3" x-text="u.height||'—'"></td>
                          <td class="px-4 py-2.5 font-mono text-[11px] text-tx3" x-text="u.depth||'—'"></td>
                          <td class="px-4 py-2.5 font-mono text-[11px] text-tx3" x-text="u.quantity||'1'"></td>
                          <td class="px-4 py-2.5 text-[11px] text-tx3 max-w-[200px]" x-text="u.notes||'—'"></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </template>

          <!-- Tall Units -->
          <template x-if="data && data.tall_units && data.tall_units.length">
            <div class="bg-card border border-border rounded-2xl overflow-hidden animate-fade-up" style="animation-delay:200ms">
              <button @click="toggle('tall')" class="w-full flex items-center gap-2.5 px-[18px] py-3 border-b border-border hover:bg-white/[.02] transition-colors">
                <span class="text-[15px]">📦</span>
                <span class="text-[13px] font-semibold">Tall Units</span>
                <span class="font-mono text-[10px] px-2 py-0.5 rounded-full bg-card2 border border-border2 text-tx3" x-text="data.tall_units.length"></span>
                <span class="ml-auto text-tx3 text-xs chevron-icon" :class="open.tall ? '' : 'closed'">▾</span>
              </button>
              <div class="section-body" :class="open.tall ? '' : 'closed'" :style="open.tall ? 'max-height: 2000px' : ''">
                <div class="overflow-x-auto">
                  <table class="w-full border-collapse text-[12.5px]">
                    <thead><tr class="bg-card2 border-b border-border2">
                      <th class="unit-th">Code</th><th class="unit-th">Description</th>
                      <th class="unit-th">Width</th><th class="unit-th">Height</th><th class="unit-th">Depth</th>
                      <th class="unit-th">Qty</th><th class="unit-th">Notes</th>
                    </tr></thead>
                    <tbody>
                      <template x-for="u in data.tall_units" :key="u.code">
                        <tr class="border-b border-border last:border-0 hover:bg-white/[.02] transition-colors">
                          <td class="px-4 py-2.5 font-mono font-semibold text-tx" x-text="u.code||'—'"></td>
                          <td class="px-4 py-2.5 font-medium text-tx" x-text="u.description||'—'"></td>
                          <td class="px-4 py-2.5 font-mono text-[11px] text-tx3" x-text="u.width||'—'"></td>
                          <td class="px-4 py-2.5 font-mono text-[11px] text-tx3" x-text="u.height||'—'"></td>

  <script>
    function kpx() {
      return {
        apiKey: localStorage.getItem('kpx_groq_key') || '',
        keyVisible: false,
        keySaved: !!localStorage.getItem('kpx_groq_key'),
        isDragging: false,
        file: null,
        fileName: '',
        fileSize: '',
        loading: false,
        progress: 0,
        progressLabel: '',
        status: { type: '', msg: '' },
        data: null,
        pages: 0,
        copied: false,
        open: {
          project: true, dimensions: true, base: true, wall: true, tall: true,
          appliances: true, worktops: true, sinks: true, taps: true,
          handles: true, lighting: true, accessories: true, notes: true, summary: true,
        },
        tips: [
          'Text-based PDFs work best',
          'Multi-page plans supported (up to 25 MB)',
          'API key is saved in your browser',
          'PDF processing runs on the server',
          'Groq llama-3.3-70b model used',
        ],

        get canExtract() {
          return !!this.file && this.apiKey.length > 15 && !this.loading;
        },

        get stats() {
          if (!this.data) return [];
          return [
            { value: (this.data.base_units||[]).length,  label: 'Base Units',  color: 'border-t-accent'          },
            { value: (this.data.wall_units||[]).length,  label: 'Wall Units',  color: 'border-t-green-500'       },
            { value: (this.data.appliances||[]).length,  label: 'Appliances',  color: 'border-t-amber-400'       },
            { value: (this.data.accessories||[]).length, label: 'Accessories', color: 'border-t-blue-400'        },
          ];
        },

        get hasProjectInfo() {
          const pi = this.data?.project_info || {};
          return Object.values(pi).some(v => v);
        },

        get projectCells() {
          const pi = this.data?.project_info || {};
          return [
            { label: 'Developer',   value: pi.developer     },
            { label: 'Location',    value: pi.location      },
            { label: 'Model/Type',  value: pi.model         },
            { label: 'Plot',        value: pi.plot          },
            { label: 'Designer',    value: pi.designer      },
            { label: 'Revision',    value: pi.revision      },
            { label: 'Date',        value: pi.date          },
            { label: 'Drawing No.', value: pi.drawing_number},
          ];
        },

        get hasDimensions() {
          const d = this.data?.dimensions || {};
          return d.total_length || d.total_depth || d.total_height || d.worktop_height || (d.key_measurements||[]).length;
        },

        get dimCells() {
          const d = this.data?.dimensions || {};
          return [
            { label: 'Total Length', value: d.total_length   },
            { label: 'Depth',        value: d.total_depth    },
            { label: 'Height',       value: d.total_height   },
            { label: 'Worktop Ht.',  value: d.worktop_height },
          ];
        },

        saveKey() {
          if (this.apiKey.length > 15) {
            localStorage.setItem('kpx_groq_key', this.apiKey);
            this.keySaved = true;
          } else {
            this.keySaved = false;
          }
        },

        acceptFile(file) {
          if (!file) return;
          if (file.type !== 'application/pdf') {
            this.setStatus('Please upload a PDF file.', 'error');
            return;
          }
          this.file = file;
          this.fileName = file.name;
          this.fileSize = this.fmtBytes(file.size);
          this.clearStatus();
        },

        toggle(key) {
          this.open[key] = !this.open[key];
        },

        async extract() {
          if (!this.canExtract) return;
          this.loading = true;
          this.data = null;
          this.clearStatus();
          this.setProgress(5, 'Uploading PDF…');

          // Simulate staged progress while server works
          const stages = [
            [15, 'Extracting text from PDF…'],
            [35, 'Parsing document structure…'],
            [50, 'Sending to Groq AI…'],
            [65, 'Analysing with llama-3.3-70b…'],
            [78, 'Structuring data…'],
          ];
          let stageIdx = 0;
          const progTimer = setInterval(() => {
            if (stageIdx < stages.length) {
              const [pct, lbl] = stages[stageIdx++];
              this.setProgress(pct, lbl);
            }
          }, 900);

          this.setStatus('Analysing with Groq llama-3.3-70b…', 'loading');

          try {
            const form = new FormData();
            form.append('pdf', this.file);
            form.append('apiKey', this.apiKey);

            const res = await fetch('/api/extract', { method: 'POST', body: form });
            clearInterval(progTimer);

            const body = await res.json();

            if (!res.ok) {
              throw new Error(body.error || `Server error ${res.status}`);
            }

            this.setProgress(100, '');
            this.setStatus('Extraction complete', 'success');
            this.data = body.data;
            this.pages = body.pages || 0;

          } catch (err) {
            clearInterval(progTimer);
            this.setProgress(0, '');
            this.setStatus(err.message, 'error');
          } finally {
            this.loading = false;
          }
        },

        reset() {
          this.file = null;
          this.fileName = '';
          this.fileSize = '';
          this.data = null;
          this.pages = 0;
          this.loading = false;
          this.setProgress(0, '');
          this.clearStatus();
        },

        setProgress(pct, label) {
          this.progress = pct;
          this.progressLabel = label;
        },

        setStatus(msg, type) {
          this.status = { msg, type };
        },

        clearStatus() {
          this.status = { type: '', msg: '' };
        },

        fmtBytes(b) {
          if (b < 1024) return b + ' B';
          if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
          return (b / 1048576).toFixed(1) + ' MB';
        },

        exportJson() {
          if (!this.data) return;
          this.triggerDownload(
            new Blob([JSON.stringify(this.data, null, 2)], { type: 'application/json' }),
            'kitchen_data.json'
          );
        },

        exportCsv() {
          if (!this.data) return;
          const rows = [
            ...(this.data.base_units  ||[]).map(u => ({...u, _type:'Base Unit'})),
            ...(this.data.wall_units  ||[]).map(u => ({...u, _type:'Wall Unit'})),
            ...(this.data.tall_units  ||[]).map(u => ({...u, _type:'Tall Unit'})),
            ...(this.data.appliances  ||[]).map(u => ({...u, _type:'Appliance'})),
          ];
          if (!rows.length) { alert('No unit data to export.'); return; }
          const keys = ['_type','code','description','type','brand','width','height','depth','quantity','notes'];
          const csv = [keys.join(','), ...rows.map(r => keys.map(k => JSON.stringify(r[k]||'')).join(','))].join('\n');
          this.triggerDownload(new Blob([csv], { type: 'text/csv' }), 'kitchen_units.csv');
        },

        async copyJson() {
          if (!this.data) return;
          await navigator.clipboard.writeText(JSON.stringify(this.data, null, 2));
          this.copied = true;
          setTimeout(() => { this.copied = false; }, 2000);
        },

        triggerDownload(blob, name) {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = name;
          a.click();
          setTimeout(() => URL.revokeObjectURL(a.href), 5000);
        },
      };
    }
  </script>

</body>
</html>
